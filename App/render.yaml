# Render — Root Directory = App
services:
  - type: web
    name: ankuaru-api
    runtime: node
    plan: free
    rootDir: App
    buildCommand: npm install && npx prisma generate && npm run build -w @ankuaru/api
    startCommand: npm run start -w @ankuaru/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EVIDENCE_DIR
        value: ./data/evidence
      - key: REPORTS_DIR
        value: ./data/reports
